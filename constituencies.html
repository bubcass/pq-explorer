    "department",
    "heading",

  const lines = [
    headers.join(","),
    ...rows.map((row) =>

  ];

  return `\uFEFF${lines.join("\n")}`;
}

      if (!hasRenderedOnce) {
        await renderFn(el, { isCurrent, skeletonOnly: true });

    });

    window.addEventListener(event, run);

define({id: "50f58d14", inputs: ["getState","getConstituencyOptions","ensureValidConstituencySelection","saveSelectedConstituency","withPreservedScroll","dispatchConstituencyChange","detectConstituencyFromLocation","getConstituenciesGeo","display"], body: (getState,getConstituencyOptions,ensureValidConstituencySelection,saveSelectedConstituency,withPreservedScroll,dispatchConstituencyChange,detectConstituencyFromLocation,getConstituenciesGeo,display) => {
{
  const wrap = document.createElement("div");
  let lastOptionsKey = "";

  async function renderConstituencySelect() {
    wrap.replaceChildren();

    const control = document.createElement("div");
    control.className = "control control--constituency";

    const heading = document.createElement("div");
    heading.className = "constituency-control-heading";

    const labelText = document.createElement("label");
    labelText.className = "control-label";
    labelText.textContent = "Constituency";
    labelText.htmlFor = "pq-constituency-select";

    const locateButton = document.createElement("button");
    locateButton.type = "button";
    locateButton.className = "constituency-location-action";
    locateButton.textContent = "Use my location";

    const select = document.createElement("select");
    select.id = "pq-constituency-select";
    select.className = "control-input";

    const locateStatus = document.createElement("span");
    locateStatus.className = "constituency-location-status";
    locateStatus.setAttribute("aria-live", "polite");
    locateStatus.textContent = getState().locationStatus ?? "";

    const options = await getConstituencyOptions();
    const selected = await ensureValidConstituencySelection();

    for (const value of options) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      option.selected = value === selected;
      select.appendChild(option);
    }

    select.addEventListener("change", async (event) => {
      window.pqConstituenciesState.selectedConstituency =
        event.target.value || null;
      window.pqConstituenciesState.locationStatus = "";
      saveSelectedConstituency(window.pqConstituenciesState.selectedConstituency);

      await withPreservedScroll(async () => {
        dispatchConstituencyChange();
      });
    });

    locateButton.addEventListener("click", async () => {
      locateButton.disabled = true;
      locateButton.textContent = "Finding constituency…";
      locateStatus.textContent = "";

      try {
        const result = await detectConstituencyFromLocation({
          constituencyGeoJSON: await getConstituenciesGeo(),
          availableConstituencies: options,
          prompt: true
        });

        if (result.ok) {
          window.pqConstituenciesState.selectedConstituency = result.constituency;
          window.pqConstituenciesState.locationStatus = `Showing ${result.constituency}`;
          saveSelectedConstituency(result.constituency);
          select.value = result.constituency;

          await withPreservedScroll(async () => {
            dispatchConstituencyChange();
          });
        } else {
          locateStatus.textContent = "Location unavailable — choose from the list.";
        }
      } catch {
        locateStatus.textContent = "Location unavailable — choose from the list.";
      } finally {
        locateButton.disabled = false;
        locateButton.textContent = "Use my location";
      }
    });

    heading.append(labelText, locateButton);
    control.append(heading, select, locateStatus);
    wrap.appendChild(control);

    lastOptionsKey = options.join("||");
  }

  renderConstituencySelect();

  async function rerenderConstituencySelectIfNeeded(force = false) {
    const options = await getConstituencyOptions();
    const nextOptionsKey = options.join("||");
  
    if (force || nextOptionsKey !== lastOptionsKey) {
      await withPreservedScroll(async () => {
        await renderConstituencySelect();
      });
    }
  }
  
  window.addEventListener("pq-constituencies:change", async () => {
    await rerenderConstituencySelectIfNeeded(false);
  });
  
  window.addEventListener("pq-constituencies:constituency-change", async () => {
    await rerenderConstituencySelectIfNeeded(true);
  });

  display(wrap);
}
}});

define({id: "9cf778cd", inputs: ["display","mountReactive","getFilteredConstituencyGeo","constituencyMap","getConstituenciesGeo","getConstituencyOptions","findConstituencyForCoordinates","saveSelectedConstituency","withPreservedScroll","dispatchConstituencyChange"], body: (display,mountReactive,getFilteredConstituencyGeo,constituencyMap,getConstituenciesGeo,getConstituencyOptions,findConstituencyForCoordinates,saveSelectedConstituency,withPreservedScroll,dispatchConstituencyChange) => {
display(
  mountReactive("constituency-map-block", async (el, { isCurrent, skeletonOnly }) => {
    if (skeletonOnly) {
      el.innerHTML = `<div class="map-skeleton skeleton-shimmer"></div>`;
      return;
    }

    const geo = await getFilteredConstituencyGeo();

    if (!isCurrent()) return;

    el.replaceChildren(
      constituencyMap(geo, {
        height: 420,
        onLocate: async ({ ok, lon, lat }) => {
          if (!ok) return;

          const geoAll = await getConstituenciesGeo();
          const options = await getConstituencyOptions();
          const nextConstituency = findConstituencyForCoordinates({
            longitude: lon,
            latitude: lat,
            constituencyGeoJSON: geoAll,
            availableConstituencies: options
          });

          if (!nextConstituency) return;
          saveSelectedConstituency(nextConstituency);
          if (window.pqConstituenciesState.selectedConstituency === nextConstituency) return;

          window.pqConstituenciesState.selectedConstituency = nextConstituency;
          window.pqConstituenciesState.locationStatus = `Showing ${nextConstituency}`;

          await withPreservedScroll(async () => {
            dispatchConstituencyChange();
          });
        }
      })
    );
  }, {
    eventName: ["pq-constituencies:change", "pq-constituencies:constituency-change"]
  })
);
}});

define({id: "c92492ef", inputs: ["display","mountReactive","getSelectedConstituencySummary","getVariantKey","Plot"], body: (display,mountReactive,getSelectedConstituencySummary,getVariantKey,Plot) => {
display(
  mountReactive("chart-block", async (el, { isCurrent, skeletonOnly }) => {
    if (skeletonOnly) {
      el.innerHTML = `
        <div class="chart-skeleton chart-skeleton--bars">
          <div class="chart-skeleton__bar skeleton-shimmer"></div>
          <div class="chart-skeleton__bar skeleton-shimmer"></div>
          <div class="chart-skeleton__bar skeleton-shimmer"></div>
          <div class="chart-skeleton__bar skeleton-shimmer"></div>
          <div class="chart-skeleton__bar skeleton-shimmer"></div>
          <div class="chart-skeleton__bar skeleton-shimmer"></div>
        </div>
      `;
      return;
    }

    const summary = await getSelectedConstituencySummary();
    const isOral = getVariantKey() === "oral";
    const rows = (summary?.topHeadings ?? []).slice(0, 15);

    if (!isCurrent()) return;

    if (!rows.length) {
      el.innerHTML = `<p class="chart-loading">No topic data available for this constituency.</p>`;
      return;
    }

    const data = rows
      .map((d) => ({
        heading: d.heading,
        count: d.count,
        questionLabel:
          isOral
            ? d.count === 1
              ? "oral question"
              : "oral questions"
            : d.count === 1
            ? "question"
            : "questions"
      }))
      .sort((a, b) => b.count - a.count || a.heading.localeCompare(b.heading, "en"));

    const wrap = document.createElement("div");
    wrap.style.position = "relative";

    const tooltip = document.createElement("div");
    tooltip.style.position = "absolute";
    tooltip.style.pointerEvents = "none";
    tooltip.style.opacity = "0";
    tooltip.style.background = "#fff";
    tooltip.style.border = "1px solid #ddd5c2";
    tooltip.style.padding = "8px 10px";
    tooltip.style.font = '12px "IBM Plex Sans", system-ui, sans-serif';
    tooltip.style.color = "#666666";
    tooltip.style.boxShadow = "0 2px 8px rgba(0,0,0,0.08)";
    tooltip.style.zIndex = "10";
    tooltip.style.maxWidth = "260px";
    tooltip.style.lineHeight = "1.35";

    const chart = Plot.plot({
      width: 860,
      height: Math.max(420, data.length * 34 + 90),
      marginTop: 10,
      marginRight: 30,
      marginBottom: 46,
      marginLeft: 260,
      x: {
        label: isOral ? "Number of oral questions" : "Number of questions",
        tickSize: 0,
        labelOffset: 40
      },
      y: {
        label: null,
        domain: data.map((d) => d.heading),
        tickSize: 0
      },
      style: {
        fontSize: "14px",
        fontFamily: "IBM Plex Sans, system-ui, sans-serif",
        background: "transparent"
      },
      marks: [
        Plot.barX(data, {
          x: "count",
          y: "heading",
          inset: 0.8,
          rx: 0,
          fill: "#1f77b4",
          ariaHidden: true
        }),
        Plot.text(data, {
          x: "count",
          y: "heading",
          text: (d) => d.count.toLocaleString("en-IE"),
          dx: 8,
          textAnchor: "start",
          lineAnchor: "middle",
          fontSize: 12,
          fill: "#666666"
        }),
        Plot.ruleX([0], {ariaHidden: true})
      ]
    });

    wrap.appendChild(chart);
    wrap.appendChild(tooltip);
    el.replaceChildren(wrap);

    const bars = chart.querySelectorAll("rect");
    const barCount = data.length;
    const targetBars = Array.from(bars).slice(-barCount);

    targetBars.forEach((bar, i) => {
      const d = data[i];

      bar.style.cursor = "pointer";

      bar.addEventListener("mousemove", (event) => {
        tooltip.innerHTML = `
          <div><strong>${d.heading}</strong></div>
          <div>${d.count.toLocaleString("en-IE")} ${d.questionLabel}</div>
        `;
        tooltip.style.opacity = "1";

        const wrapRect = wrap.getBoundingClientRect();
        const x = event.clientX - wrapRect.left + 12;
        const y = event.clientY - wrapRect.top - 12;

        tooltip.style.left = `${x}px`;
        tooltip.style.top = `${y}px`;
      });

      bar.addEventListener("mouseleave", () => {
        tooltip.style.opacity = "0";
      });
    });
  }, {
    eventName: ["pq-constituencies:change", "pq-constituencies:constituency-change"]
  })
);
}});

      return;

    const selected = await ensureValidConstituencySelection();
    const rows = await getDownloadRowsForSelectedConstituency();

    if (!isCurrent()) return;

    if (!selected || !rows.length) {
      el.innerHTML = "";
      return;
    }

    const button = document.createElement("button");
    button.type = "button";
    button.className = "pq-download";

    button.addEventListener("click", () => {
      const csv = buildConstituencyCsv(rows);
      const filename = `pq_${selected
        .replace(/\s+/g, "_")
        .toLowerCase()}_${getState().year}_${getVariantKey()}.csv`;

    el.replaceChildren(button);

}});
