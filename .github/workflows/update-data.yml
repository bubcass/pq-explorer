name: Nightly Data Refresh

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: pq-explorer-data-refresh

permissions: {}

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      snapshot: ${{ steps.commit_data.outputs.snapshot }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build data
        run: npm run build:data

      - name: Commit refreshed data if needed
        id: commit_data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Deputy detail generation writes the same refreshed JSON to both
          # src/data and src/static/data. Stage both copies before rebasing.
          git add src/data src/generated src/static/data/pq

          if ! git diff --cached --quiet; then
            git commit -m "Nightly PQ data refresh"

            # main may advance while the data build is running. Rebase the
            # generated snapshot onto the latest main and retry if another
            # push wins the race between fetch and push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main

              if git push origin HEAD:main; then
                break
              fi

              if [ "$attempt" -eq 3 ]; then
                echo "Could not push refreshed data after 3 attempts" >&2
                exit 1
              fi
            done
          fi
          echo "snapshot=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-pages:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.snapshot }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: node scripts/pq/copy-deputy-json-to-dist.js

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

